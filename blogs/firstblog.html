<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>firstblog</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('wood.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .image-container {
            position: relative;
            display: inline-block;
        }

        .image-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: white;             
            font-size: 24px;
            font-family: sans-serif;
            text-align: center;
        }

        pre {
            color: #2C2C2C;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            font-family: inherit;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="image-container">
  <img src="firstblog.jpg" alt="firstblog">
  <div class="overlay-text"> firstblog </div>
</div>

<pre>

</pre>

</body>
</html>
